<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Trivvo">
  <!-- Reversed mark on a solid ink tile (design system 3.5). A bare white mark would
       disappear against the light browser tab strip, so it needs the tile behind it. -->
  <rect width="100" height="100" rx="22" fill="#10231C"/>
  <g transform="translate(18 18) scale(0.64)">
    <g transform="translate(-3 2) rotate(12 50 50)" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 34 L50 76 L84 34" stroke="#F4F1EA"/>
      <path d="M33 23 L50 44 L67 23" stroke="#FF85C7"/>
    </g>
  </g>
</svg>
