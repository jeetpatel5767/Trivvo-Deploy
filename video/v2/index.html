<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Trivvo film v2</title>
<!-- Trivvo product film v2: one continuous camera journey, 1920x1080, driven by seek(t).
     Cue times are mirrored in v2/audio.py; change them together. -->
<style>
@font-face{font-family:J;font-weight:500;src:url(../../video-kit/brand/fonts/PlusJakartaSans-Medium.ttf)}
@font-face{font-family:J;font-weight:600;src:url(../../video-kit/brand/fonts/PlusJakartaSans-SemiBold.ttf)}
@font-face{font-family:J;font-weight:700;src:url(../../video-kit/brand/fonts/PlusJakartaSans-Bold.ttf)}
@font-face{font-family:J;font-weight:800;src:url(../../video-kit/brand/fonts/PlusJakartaSans-ExtraBold.ttf)}
html,body{margin:0;background:#10231C;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:J,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
.t{position:absolute;white-space:nowrap;isolation:isolate}
.w{display:inline-block;position:relative;z-index:1;overflow:hidden;vertical-align:top;padding:0 .04em .18em;margin:0 -.04em -.18em}
.nm .w{overflow:visible}
.wi{display:inline-block;transform-origin:50% 70%}
.pk{color:#FF85C7}
.f3{transform-style:preserve-3d}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const C={bone:'#F4F1EA',paper:'#FFFFFF',ink:'#10231C',inkL:'#1B2F28',pink:'#FF85C7',soft:'#FFE8F4',muted:'#4A5A54',subtle:'#5E6A64',amber:'#FFF1D6',coral:'#FFE0DC'};
const ICON=n=>`../../frontend/public/icons/objects/${n}.svg`;
const PIN_D='M12 21.5s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z';
const FULL={left:0,top:0,width:'1920px',height:'1080px'};

/* ---------- maths ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, prog=(t,s,d)=>clamp((t-s)/d), lerp=(a,b,x)=>a+(b-a)*x;
const E={
  o3:x=>1-Math.pow(1-x,3), o5:x=>1-Math.pow(1-x,5), i3:x=>x*x*x, i2:x=>x*x,
  ox:x=>x>=1?1:1-Math.pow(2,-10*x), io3:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  sp:x=>x<=0?0:x>=1?1:1-Math.exp(-6.5*x)*Math.cos(10.5*x),
  bo:x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375},
};
const hex=c=>{const n=parseInt(c.slice(1),16);return[n>>16,(n>>8)&255,n&255]};
const mix=(a,b,x)=>{const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],x))).join(',')})`};
const px=v=>v+'px', f1=v=>v.toFixed(1), f3=v=>v.toFixed(3);
const tf=(e,s)=>{e.style.transform=s}, op=(e,v)=>{e.style.opacity=v};
function rnd(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function blob(cx,cy,R,t,wob){let d='';for(let k=0;k<=72;k++){const a=k/72*Math.PI*2,r=Math.max(0,R*(1+wob*(.05*Math.sin(6*a+t*9)+.03*Math.sin(11*a-t*7))));d+=(k?'L':'M')+f1(cx+r*Math.cos(a))+' '+f1(cy+r*Math.sin(a))}return`path('${d}Z')`}

/* ---------- dom ---------- */
const stage=document.getElementById('stage');
function el(p,st={},html=''){const e=document.createElement('div');e.style.position='absolute';Object.assign(e.style,st);if(html)e.innerHTML=html;p.appendChild(e);return e}
const scenes=[],texts=[];
function Scene(a,b,bg,clip){const d=el(stage,{...FULL,background:bg,overflow:'hidden'});d.className='scene';const s={a,b,d,clip,r:()=>{}};scenes.push(s);return s}
const img=(n,s)=>`<img src="${ICON(n)}" style="width:${s}px;height:${s}px;display:block">`;
const pinSVG=fill=>`<svg viewBox="0 0 24 24" width="64" height="64" style="display:block;overflow:visible"><path d="${PIN_D}" fill="${fill}"/><circle cx="12" cy="10.2" r="2.7" fill="${C.bone}"/></svg>`;
const markSVG=(s,o,i)=>`<svg viewBox="0 0 100 100" width="${s}" height="${s}"><g transform="translate(-3 2) rotate(12 50 50)" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M16 34 L50 76 L84 34" stroke="${o}"/><path d="M33 23 L50 44 L67 23" stroke="${i}"/></g></svg>`;

/* Text. [w] pink, {w} pink marker, ~w~ pink strike. chars:1 splits letters, nm:1 drops the masks. */
function T(p,text,o){
  const b=document.createElement('div');b.className='t'+(o.nm?' nm':'');
  const st={left:px(o.x||0),top:px(o.y||0),fontSize:px(o.size),color:o.color||C.ink,fontWeight:o.weight||800,letterSpacing:(o.ls??-0.045)+'em',lineHeight:o.lh||1.04};
  if(o.center){st.left='0';st.width='1920px';st.textAlign='center'}
  if(o.cx!=null){st.left=px(o.cx-1000);st.width='2000px';st.textAlign='center'}
  if(o.right!=null){st.left=px(o.right-2000);st.width='2000px';st.textAlign='right'}
  if(o.inline){st.position='relative';st.left='auto';st.top='auto';st.width='auto'}
  Object.assign(b.style,st);p.appendChild(b);
  const Tx={box:b,inner:[],words:[],bars:[],o,lines:[]};
  const span=(ld,txt,cls)=>{const w=document.createElement('span');w.className='w';const wi=document.createElement('span');wi.className='wi '+cls;wi.textContent=txt;w.appendChild(wi);ld.appendChild(w);Tx.inner.push(wi);return w};
  text.split('\n').forEach(line=>{
    const ld=document.createElement('div');Tx.lines.push(ld);
    line.split(' ').forEach((tok,i)=>{
      let cls='',flag=null,m;
      if(m=tok.match(/^\[(.*)\]$/)){tok=m[1];cls='pk'}
      if(m=tok.match(/^\{(.*)\}$/)){tok=m[1];flag='hl'}
      if(m=tok.match(/^~(.*)~$/)){tok=m[1];flag='st'}
      if(i){if(o.chars)span(ld,' ','');else ld.appendChild(document.createTextNode(' '))}
      const first=Tx.inner.length,ws=(o.chars?[...tok]:[tok]).map(c=>span(ld,c,cls));
      Tx.words.push({w:ws[0],last:ws[ws.length-1],flag,first,n:ws.length});
    });
    b.appendChild(ld);
  });
  texts.push(Tx);return Tx;
}
function decorate(Tx){
  const fs=Tx.o.size,groups=[];let cur=null;
  Tx.words.forEach(({w,last,flag})=>{
    if(!flag){cur=null;return}
    if(cur&&cur.flag===flag&&cur.top===w.offsetTop)cur.r=last.offsetLeft+last.offsetWidth;
    else groups.push(cur={flag,top:w.offsetTop,l:w.offsetLeft,r:last.offsetLeft+last.offsetWidth});
  });
  groups.forEach(g=>{
    const bar=document.createElement('div');
    Object.assign(bar.style,{position:'absolute',left:px(g.l-fs*.02),width:px(g.r-g.l+fs*.04),transformOrigin:'0 50%',transform:'scaleX(0)'});
    if(g.flag==='hl'){Object.assign(bar.style,{top:px(g.top+fs*.12),height:px(fs*.9),background:C.pink,borderRadius:px(fs*.16),zIndex:0});Tx.box.insertBefore(bar,Tx.box.firstChild)}
    else{Object.assign(bar.style,{top:px(g.top+fs*.5),height:px(Math.max(6,fs*.085)),background:C.pink,borderRadius:'99px',zIndex:2});Tx.box.appendChild(bar)}
    Tx.bars.push(bar);
  });
}
const vis=(Tx,t,a,b,tail=.6)=>{Tx.box.style.visibility=(t>=a-.001&&(b==null||t<b+tail+Tx.inner.length*.02))?'visible':'hidden'};
/* rise out of masks */
function kin(Tx,t,a,b,o={}){
  const st=o.stagger??.05,d=o.dur??.8;
  Tx.inner.forEach((s,i)=>{let y=125*(1-E.ox(prog(t,(o.starts?o.starts[i]:a+i*st),d)));if(b!=null&&t>=b)y-=125*E.i3(prog(t,b+i*.015,.32));s.style.transform=`translate3d(0,${f1(y)}%,0)`});
  vis(Tx,t,a,b,.4);if(b!=null)Tx.bars.forEach(br=>br.style.opacity=1-prog(t,b,.25));
}
/* letters flip up on their baseline */
function flip(Tx,t,a,b,o={}){
  const st=o.stagger??.022,d=o.dur??.65;
  Tx.inner.forEach((s,i)=>{const p=E.o3(prog(t,a+i*st,d));let r=(1-p)*-105,v=p;
    if(b!=null&&t>=b){const q=E.i3(prog(t,b+i*.01,.34));r+=q*105;v*=1-q}
    s.style.transform=`perspective(600px) rotateX(${f1(r)}deg)`;s.style.opacity=f3(v)});
  vis(Tx,t,a,b);
}
/* words fly out of the screen at the viewer, settle with a blur pull */
function depth(Tx,t,a,b,o={}){
  const st=o.stagger??.11,d=o.dur??.9;
  Tx.inner.forEach((s,i)=>{const p=E.o5(prog(t,a+i*st,d));let sc=lerp(2.6,1,p),bl=(1-p)*18,v=Math.min(1,p*1.7);
    if(b!=null&&t>=b){const q=E.i3(prog(t,b+i*.035,.42));sc*=1+q*2.2;bl+=q*16;v*=1-q}
    s.style.transform=`scale(${f3(sc)})`;s.style.filter=bl>.05?`blur(${f1(bl)}px)`:'none';s.style.opacity=f3(v)});
  vis(Tx,t,a,b);
}
/* words whip in from the right with a skew */
function slide(Tx,t,a,b,o={}){
  const st=o.stagger??.07,d=o.dur??.7,dx=o.dx??480;
  Tx.inner.forEach((s,i)=>{const p=E.o5(prog(t,a+i*st,d));let x=(1-p)*dx,v=Math.min(1,p*2);
    if(b!=null&&t>=b){const q=E.i3(prog(t,b+i*.02,.35));x-=q*dx*.7;v*=1-q}
    s.style.transform=`translateX(${f1(x)}px) skewX(${f1((1-p)*-20)}deg)`;s.style.opacity=f3(v)});
  vis(Tx,t,a,b);
}
/* letters drop in with a bounce, then fall away under gravity */
function dropFall(Tx,t,a,b,o={}){
  const st=o.stagger??.035,d=o.dur??.8,h=o.h??-320;
  Tx.inner.forEach((s,i)=>{const p=prog(t,a+i*st,d);let y=(1-E.bo(p))*h,r=0;
    if(b!=null&&t>=b){const dt=Math.max(0,t-b-((i*7)%5)*.03);y+=.5*4200*dt*dt-260*dt;r=(i%2?1:-1)*(25+(i*13)%40)*dt*2.4}
    s.style.transform=`translateY(${f1(y)}px) rotate(${f1(r)}deg)`;s.style.opacity=p>0?1:0});
  vis(Tx,t,a,b,1.2);
}
function bars(Tx,t,s,d=.55){Tx.bars.forEach((br,i)=>tf(br,`scaleX(${f3(E.ox(prog(t,s+i*.08,d)))})`))}

/* Odometer: digits roll like a slot machine and land in turn */
function Odo(p,text,o){
  const b=el(p,{left:px(o.cx-1000),top:px(o.y),width:'2000px',textAlign:'center',fontSize:px(o.size),fontWeight:800,letterSpacing:'-0.05em',lineHeight:1,color:o.color||C.ink,whiteSpace:'nowrap'});
  const cols=[];
  [...text].forEach(ch=>{
    const c=document.createElement('span');Object.assign(c.style,{display:'inline-block',verticalAlign:'top',height:'1em',position:'relative'});
    if(/\d/.test(ch)){c.style.overflow='hidden';const s=document.createElement('span');s.style.display='block';
      s.innerHTML=[...Array(40)].map((_,k)=>`<span style="display:block;height:1em;line-height:1">${k%10}</span>`).join('');c.appendChild(s);cols.push({c,s,d:+ch})}
    else{c.textContent=ch;cols.push({c})}
    b.appendChild(c);
  });
  return{b,cols,digits:cols.filter(c=>c.s)};
}
function odo(O,t,starts,lands){O.digits.forEach((c,k)=>{const fin=20+c.d,p=prog(t,starts[k],lands[k]-starts[k]);const pos=fin*E.o5(p)+(p>=1?.14*Math.sin(Math.PI*prog(t,lands[k],.28)):0);tf(c.s,`translateY(${(-pos).toFixed(4)}em)`)})}

/* Brand pieces */
function Mark(p,size,outer,inner){
  const d=el(p,{position:'relative',width:px(size),height:px(size),flex:'none'},
    `<svg viewBox="0 0 100 100" width="${size}" height="${size}" style="overflow:visible"><g transform="translate(-3 2) rotate(12 50 50)" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M16 34 L50 76 L84 34" stroke="${outer}" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="1"/><path d="M33 23 L50 44 L67 23" stroke="${inner}" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="1"/></g></svg>`);
  const ps=d.querySelectorAll('path');return{d,o:ps[0],i:ps[1]};
}
function markAnim(M,t,a,b){
  [[M.o,a],[M.i,b]].forEach(([p,s])=>{const q=E.ox(prog(t,s,.55));p.setAttribute('stroke-dashoffset',(1-q).toFixed(4));p.style.opacity=q>.002?1:0});
  tf(M.d,`scale(${f3(.86+.14*E.sp(prog(t,a,.9)))})`);
}
function Seal(p,size,cx,cy){
  const disc=el(p,{left:px(cx-size/2),top:px(cy-size/2),width:px(size),height:px(size),borderRadius:'50%',background:C.ink,display:'flex',alignItems:'center',justifyContent:'center',opacity:0},
    `<svg viewBox="0 0 24 24" width="${size*.52}" height="${size*.52}"><path d="M6.2 12.6l3.7 3.7L17.8 8.4" fill="none" stroke="${C.pink}" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="1"/></svg>`);
  return{disc,chk:disc.querySelector('path')};
}
function sealAnim(S,t,t0){const p=prog(t,t0,.75);op(S.disc,p>0?1:0);tf(S.disc,`scale(${f3(E.sp(p))}) rotate(${f1(-18*(1-E.o3(p)))}deg)`);
  const c=E.ox(prog(t,t0+.18,.42));S.chk.setAttribute('stroke-dashoffset',(1-c).toFixed(4));S.chk.style.opacity=c>.002?1:0}
function Rings(p,cx,cy,w,h,n,color,bw){return[...Array(n)].map(()=>el(p,{left:px(cx-w/2),top:px(cy-h/2),width:px(w),height:px(h),boxSizing:'border-box',borderRadius:'50%',border:`${bw}px solid ${color}`,opacity:0}))}
function ringsAnim(R,t,t0,gap,dur,maxS,o0=.6){R.forEach((r,i)=>{const q=prog(t,t0+i*gap,dur);op(r,q>0&&q<1?o0*(1-q):0);tf(r,`scale(${f3(.05+maxS*E.ox(q))})`)})}
function Burst(p,cx,cy,n,dist,seed,cols=[C.ink,C.bone]){const r=rnd(seed);return[...Array(n)].map((_,i)=>{const a=i/n*Math.PI*2+r()*.4,d=dist*(.55+r()*.65),s=Math.round(7+r()*13);return{e:el(p,{left:px(cx-s/2),top:px(cy-s/2),width:px(s),height:px(s),borderRadius:'50%',background:cols[i%cols.length],opacity:0}),tx:Math.cos(a)*d,ty:Math.sin(a)*d,dl:r()*.1}})}
function burstAnim(B,t,t0,dur=1.15){B.forEach(d=>{const q=prog(t,t0+d.dl,dur),e=E.ox(q);op(d.e,q>0&&q<1?(q<.12?q/.12:1-(q-.12)/.88):0);tf(d.e,`translate(${f1(d.tx*e)}px,${f1(d.ty*e+140*q*q)}px) scale(${q>0?1-.5*q:0})`)})}
function Splash(p,n,seed){const r=rnd(seed);return[...Array(n)].map((_,i)=>({e:el(p,{left:0,top:0,width:'14px',height:'14px',borderRadius:'50%',background:C.pink,opacity:0}),vx:(i-(n-1)/2)*115+(r()-.5)*50,vy:-(460+r()*240),s:.55+r()*.7}))}
function splashAnim(S,t,t0,x,y){S.forEach(d=>{const dt=t-t0;if(dt<0||dt>.8){op(d.e,0);return}op(d.e,1-dt/.8);tf(d.e,`translate(${f1(x+d.vx*dt-7)}px,${f1(y+d.vy*dt+1000*dt*dt-7)}px) scale(${f3(d.s*(1-dt*.8))})`)})}
function Ripples(p,n,w,h,color){return[...Array(n)].map(()=>el(p,{left:0,top:0,width:px(w),height:px(h),boxSizing:'border-box',borderRadius:'50%',border:`3px solid ${color}`,opacity:0}))}
function ripAnim(R,t,t0,x,y,w,h){R.forEach((r,i)=>{const q=prog(t,t0+i*.15,1.2);op(r,q>0&&q<1?.9*(1-q):0);tf(r,`translate(${f1(x-w/2)}px,${f1(y-h/2)}px) scale(${f3(.05+2.2*E.ox(q))})`)})}
function baseline(container){const m=document.createElement('span');m.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';container.appendChild(m);const y=m.getBoundingClientRect().top;m.remove();return y}
let H1={cx:960,cy:450,rx:30,ry:70},H4={cx:1200,cy:450,r:25},DROPT={x:960,y:500};

/* ======================= 1 · the drop, the money (0–5.35) ======================= */
const S1=Scene(0,5.35,C.ink);
const s1Drop=el(S1.d,{left:'944px',top:0,width:'32px',height:'40px',borderRadius:'50% 50% 50% 50% / 62% 62% 38% 38%',background:C.pink});
const s1Rip=Ripples(S1.d,4,420,110,C.pink),s1Spl=Splash(S1.d,7,3);
const s1Pink=el(S1.d,{...FULL,background:C.pink});
const s1Cup=el(s1Pink,{left:'890px',top:'140px',width:'140px',height:'140px'},img('coffee-cup',140));
const s1Num=Odo(s1Pink,'₹150',{cx:960,y:300,size:300});
const s1Ring=Rings(s1Pink,960,450,320,320,3,C.ink,4),s1Burst=Burst(s1Pink,960,450,22,560,4);
const s1Cap1=T(s1Pink,'Earned in 20 minutes.',{center:1,y:690,size:72,nm:1,chars:1});
const s1Cap2=T(s1Pink,'For having a coffee.',{center:1,y:690,size:72,nm:1,chars:1});
S1.r=t=>{
  const pd=prog(t,.15,.55);s1Drop.style.display=t>=.15&&t<.7?'block':'none';
  tf(s1Drop,`translateY(${f1(lerp(-80,600,E.i2(pd)))}px) scale(${f3(1-.15*pd)},${f3(1+.6*pd*pd)})`);
  ripAnim(s1Rip,t,.7,960,640,420,110);splashAnim(s1Spl,t,.7,960,640);
  const bp=prog(t,.95,.9);s1Pink.style.clipPath=bp>=1?'none':blob(960,640,1300*E.o3(bp),t,1-bp*.6);s1Pink.style.visibility=t>=.95?'visible':'hidden';
  odo(s1Num,t,[1.15,1.15,1.15],[2.0,2.25,2.5]);
  const ap=prog(t,1.0,.5),sq=prog(t,2.5,.5),w=Math.sin(Math.PI*sq)*(1-sq)*.08,base=.9+.1*E.ox(ap);
  op(s1Num.b,E.o3(ap));tf(s1Num.b,`scale(${f3(base*(1+w))},${f3(base*(1-w))})`);
  ringsAnim(s1Ring,t,2.5,.18,1.3,3.4,.5);burstAnim(s1Burst,t,2.52);
  flip(s1Cap1,t,2.85,3.8);flip(s1Cap2,t,4.3,null);
  const cp=prog(t,4.3,.8);op(s1Cup,cp>0?1:0);tf(s1Cup,`translateY(${f1((1-E.sp(cp))*60)}px) scale(${f3(E.sp(cp))}) rotate(${f1(-18*(1-E.o3(cp)))}deg)`);
  tf(s1Pink,`scale(${f3(Math.pow(70,E.i3(prog(t,4.55,.8))))})`);       // dive into the 0
};

/* ======================= 2 · the ad wall (4.5–9.8) ======================= */
const S2=Scene(4.5,9.8,C.bone,t=>{const p=prog(t,4.55,.8);if(p>=1)return'none';const z=Math.pow(70,E.i3(p));return`ellipse(${f1(H1.rx*z)}px ${f1(H1.ry*z)}px at ${f1(H1.cx)}px ${f1(H1.cy)}px)`});
const s2W=el(S2.d,{...FULL});
const s2P=el(s2W,{...FULL,perspective:'1300px',perspectiveOrigin:'960px 300px'});
const WP=1560,WH=3200;
const wall=el(s2P,{left:px(960-WP/2),top:px(540-WH/2),width:px(WP),height:px(WH)});wall.className='f3';
const ADS=[['50% OFF',C.amber],['NEW IN',C.coral],['MEGA SALE',C.soft],['BUY 1 GET 1','#E9E4D9'],['FLAT ₹200 OFF',C.amber],['LIMITED',C.paper],['TODAY ONLY',C.coral],
           ['SALE',C.soft],['FREE DELIVERY','#E9E4D9'],['70% OFF',C.amber],['JUST DROPPED',C.paper],['LAST CHANCE',C.coral],['FLASH DEAL',C.soft],['2 FOR 1','#E9E4D9']];
const wallCards=[];
for(let r=0;r<14;r++)for(let c=0;c<4;c++){
  const [txt,bg]=ADS[(r*3+c*5)%ADS.length];
  const d=el(wall,{left:px(30+c*385),top:0,width:'350px',height:'210px',borderRadius:'32px',background:bg,overflow:'hidden'});
  el(d,{left:'30px',top:'36px',fontSize:'40px',fontWeight:800,letterSpacing:'-0.04em',color:C.ink,whiteSpace:'nowrap'},txt);
  el(d,{left:'30px',top:'108px',width:'170px',height:'14px',borderRadius:'7px',background:'rgba(16,35,28,.14)'});
  el(d,{left:'30px',top:'138px',width:'110px',height:'14px',borderRadius:'7px',background:'rgba(16,35,28,.09)'});
